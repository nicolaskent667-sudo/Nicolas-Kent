<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contacto — Nicolás Kent</title>
<meta name="description" content="Contacto de Nicolás Kent, escritor." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&display=swap" rel="stylesheet" />
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png" />
<link rel="apple-touch-icon" href="images/apple-touch-icon.png" />
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/scrambled-text.css" />
<link rel="stylesheet" href="css/scroll-reveal.css" />
<link rel="stylesheet" href="css/splash-cursor.css" />
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand">
      <span class="brand-logo-crop">
        <img class="brand-logo-img" src="images/logo-horizontal.jpg" alt="Nicolás Kent — no soy como otros escritores" />
      </span>
    </a>
    <nav class="main-nav" aria-label="Navegación principal">
      <a href="index.html">Inicio</a>
      <a href="sobre-el-autor.html">Sobre el autor</a>
      <a href="libros.html">Libros</a>
      <a href="contacto.html" aria-current="page">Contacto</a>
    </nav>
    <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<section class="page-banner">
  <div class="watermark" aria-hidden="true">Contacto</div>
  <div class="container">
    <h1>Contacto</h1>
    <p class="lead">Para prensa, editoriales o lectores: escríbeme por acá.</p>
  </div>
</section>

<div class="container">
  <div class="contact-layout" style="padding: 64px 0 100px;">
    <div class="contact-info">
      <div class="item">
        <p class="label">Correo electrónico</p>
        <a href="mailto:nicolaskent667@gmail.com">nicolaskent667@gmail.com</a>
      </div>
      <div class="item">
        <p class="label">Redes sociales</p>
        <div class="social-links">
          <a href="https://instagram.com/nicolaskent667" target="_blank" rel="noopener" aria-label="Instagram" title="Instagram: @nicolaskent667">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4.5"/><circle cx="17.5" cy="6.5" r="1"/></svg>
          </a>
        </div>
        <p style="margin-top: 10px; font-size: 14px; color: var(--label);">@nicolaskent667</p>
      </div>
    </div>

    <div>
      <form class="contact-form" novalidate>
        <div class="form-field">
          <label for="name">Nombre</label>
          <input type="text" id="name" name="name" autocomplete="name" />
          <span class="error-msg"></span>
        </div>
        <div class="form-field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" autocomplete="email" />
          <span class="error-msg"></span>
        </div>
        <div class="form-field">
          <label for="message">Mensaje</label>
          <textarea id="message" name="message" rows="6"></textarea>
          <span class="error-msg"></span>
        </div>
        <button type="submit" class="form-submit">Enviar mensaje</button>
        <div class="form-success" role="status"></div>
      </form>
    </div>
  </div>
</div>

<footer class="site-footer">
  <div class="container">
    <div class="footer-grid">
      <a href="index.html" class="brand footer-brand">
        <span class="brand-logo-crop">
          <img class="brand-logo-img" src="images/logo-footer.png" alt="Nicolás Kent" />
        </span>
      </a>
      <nav class="footer-nav" aria-label="Navegación de pie de página">
        <a href="index.html">Inicio</a>
        <a href="sobre-el-autor.html">Sobre el autor</a>
        <a href="libros.html">Libros</a>
        <a href="contacto.html">Contacto</a>
      </nav>
    </div>
    <p class="copyright">© 2026 Nicolás Kent. Todos los derechos reservados.</p>
  </div>
</footer>

<script src="js/main.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/SplitText.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrambleTextPlugin.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
<script src="js/scroll-reveal.js"></script>
<script src="js/splash-cursor.js"></script>
<script src="js/scrambled-text.js"></script>
</body>
</html>
